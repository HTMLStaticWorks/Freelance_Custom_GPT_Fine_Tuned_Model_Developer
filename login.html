<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Alex Rivera - Custom GPT & Fine-Tuning Expert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <style>
        body {
            background: radial-gradient(circle at top right, var(--ai-glow), transparent), var(--primary-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body data-theme="dark" class="auth-page">
    <!-- Theme/RTL Toggles -->
    <div class="position-fixed top-0 end-0 p-4 d-flex gap-3" style="z-index: 1050;">
        <button class="btn btn-link p-0" id="theme-toggle" style="color: var(--text-primary);"><i class="bi bi-moon-stars"></i></button>
        <button class="btn btn-link p-0 text-decoration-none" id="rtl-toggle" style="color: var(--text-primary);" title="Toggle RTL"><i class="bi bi-arrow-left-right"></i></button>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="auth-card">
                <div class="text-center mb-4">
                    <a href="index.html" class="navbar-brand d-flex align-items-center justify-content-center mb-4">
                        <i class="bi bi-cpu-fill me-2 text-cyan fs-2"></i>
                        <span class="fw-bold fs-3" style="color: var(--text-primary);">NEURAL<span class="text-cyan">CORE</span></span>
                    </a>
                    <h2 class="fw-bold">Welcome Back</h2>
                    <p class="text-muted small">Access your custom model orchestration dashboard</p>
                </div>
                <form>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Email Address</label>
                        <input type="email" class="form-control auth-form-control" placeholder="name@company.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control auth-form-control" placeholder="••••••••">
                            <button class="btn password-toggle-btn auth-form-control" type="button">
                                <i class="bi bi-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                        </div>
                        <a href="#" class="small text-cyan text-decoration-none">Forgot Password?</a>
                    </div>
                    <button class="btn btn-primary w-100 py-3 mb-4" type="button" onclick="location.href='dashboard.html'">Login to Platform</button>
                    <div class="text-center mb-4">
                        <span class="small text-muted">Or continue with</span>
                    </div>
                    <div class="d-flex gap-3">
                        <button class="social-btn btn w-100 py-2"><i class="bi bi-google me-2"></i> Google</button>
                        <button class="social-btn btn w-100 py-2"><i class="bi bi-apple me-2"></i> Apple</button>
                    </div>
                    <div class="text-center mt-5">
                        <p class="small text-muted">Don't have an account? <a href="register.html" class="text-cyan">Sign up</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | NeuralCore AI</title>
    <meta name="description" content="Create your NeuralCore account to access AI model development tools, fine-tuning platform, and RAG system builder.">
    <meta name="keywords" content="signup, create account, AI platform, custom GPT development">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <style>
        body {
            background: radial-gradient(circle at bottom right, var(--ai-glow), transparent), var(--primary-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body data-theme="dark" class="auth-page">
    <!-- Theme/RTL Toggles -->
    <div class="position-fixed top-0 end-0 p-4 d-flex gap-3" style="z-index: 1050;">
        <button class="btn btn-link p-0" id="theme-toggle" style="color: var(--text-primary);"><i class="bi bi-moon-stars"></i></button>
        <button class="btn btn-link p-0 text-decoration-none" id="rtl-toggle" style="color: var(--text-primary);" title="Toggle RTL"><i class="bi bi-arrow-left-right"></i></button>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="auth-card">
                <div class="text-center mb-4">
                    <a href="index.html" class="navbar-brand d-flex align-items-center justify-content-center mb-4">
                        <i class="bi bi-cpu-fill me-2 text-cyan fs-2"></i>
                        <span class="fw-bold fs-3" style="color: var(--text-primary);">NEURAL<span class="text-cyan">CORE</span></span>
                    </a>
                    <h2 class="section-title fw-bold">Join NeuralCore</h2>
                    <p class="text-muted small">Start building custom AI assistants with me</p>
                </div>
                <form>
                    <div class="mb-3">
                        <label class="form-label small text-muted">First Name</label>
                        <input type="text" class="form-control auth-form-control" placeholder="John" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Last Name</label>
                        <input type="text" class="form-control auth-form-control" placeholder="Doe" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Email Address</label>
                        <input type="email" class="form-control auth-form-control" placeholder="name@company.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control auth-form-control" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" required>
                            <button class="btn password-toggle-btn auth-form-control" type="button">
                                <i class="bi bi-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Confirm Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control auth-form-control" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" required>
                            <button class="btn password-toggle-btn auth-form-control" type="button">
                                <i class="bi bi-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="agreeTerms" required>
                        <label class="form-check-label small text-muted" for="agreeTerms">
                            I agree to the <a href="#" class="text-cyan text-decoration-none">Terms and Conditions</a> and <a href="#" class="text-cyan text-decoration-none">Privacy Policy</a>
                        </label>
                    </div>
                    <button class="btn btn-primary w-100 py-3" type="submit">Create Account</button>
                </form>
                <div class="text-center mt-4">
                    <p class="text-muted small">Already have an account? <a href="login.html" class="text-cyan text-decoration-none">Login here</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
</body>
</html>
